[package]
name = "promptarium"
version = "0.3.3"
description = "Local-first desktop library for Markdown prompts"
authors = ["ShadyUnderLight"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique so it wouldn't conflict with the bin name. This seems to be only an
# issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "promptarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Self-update: fetch a newer signed build from GitHub Releases and install it.
# `process` is only here for the post-install relaunch the updater needs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"

[dev-dependencies]
# Unique temp-dir names in the module tests.
uuid = { version = "1", features = ["v4"] }
